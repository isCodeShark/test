<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Akhd Invitation of Rafid and Shanice" />
    <meta property="og:title" content="Rafid &amp; Shanice - Akhd Invitation" />
    <meta property="og:description" content="Kindly join us for the Akhd of Rafid and Shanice on April 3, 2026." />
    <meta property="og:type" content="website" />
    <title>Rafid &amp; Shanice - Akhd Invitation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Fleur+De+Leah&family=Great+Vibes&family=Passions+Conflict&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <p class="instruction">Tap the seal to open</p>
      <div class="envelope-wrapper" id="envelope" role="button" tabindex="0" aria-label="Open wedding invitation">
        <div class="envelope">
          <div class="envelope-back"></div>

          <div class="card">
            <!-- Opaque cover that hides text until opened -->
            <div class="card-cover"></div>
            
            <div class="card-content">
              <div class="bismillah">﷽</div>
              <div class="header-text">
                <p>KINDLY JOIN US FOR THE AKHD OF</p>
              </div>
              
              <div class="names">

                <h1>Rafid</h1>
                <p class="parent-text">son of Khurshid Alam &amp; Ayesha Akter Alpona</p>
                
                <p class="ampersand">&amp;</p>

                <h1>Shanice</h1>
                <p class="parent-text">daughter of Manock Keosayavong &amp; Khamsay Khouvilay</p>

                
              </div>

              <div class="details-section">
                <div class="details">
                  <p class="date">FRIDAY, APRIL 3rd, 2026</p>
                  <p class="time">7 PM</p>
                </div>
                
                <div class="separator-line"></div>
                
                <div class="venue">
                  <p class="venue-name">DHAKA REGENCY HOTEL</p>
                  <p class="venue-address">Airport Road | Nikunjo 2, Dhaka</p>
                </div>
              </div>
            </div>
          </div>

          <!-- Golden Gatefold Doors -->
          <div class="gates">
            <div class="gate left-gate"></div>
            <div class="gate right-gate"></div>
          </div>

          <div class="wax-seal" id="seal"></div>
        </div>
      </div>
    </div>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
